services:
  # ── Morphix 3D Backend API ──
  - type: web
    name: morphix3d-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        value: https://morphix3d.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: morphix3d-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_SERVER_URL
        value: http://localhost:8000
      - key: S3_BUCKET
        value: morphix3d-assets

databases:
  # ── PostgreSQL Database ──
  - name: morphix3d-db
    plan: free
    databaseName: morphix3d
    user: morphix
